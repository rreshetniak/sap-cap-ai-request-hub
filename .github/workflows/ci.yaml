name: Request Hub CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Install and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

  package:
    name: Build MTA archive
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Cloud MTA Build Tool
        run: npm install --global mbt@1.2.49

      - name: Build MTA archive
        run: mbt build -t mta_archives --mtar sap-cap-ai-request-hub_0.1.0.mtar

      - name: Verify MTA archive
        run: |
          ls -lh mta_archives/sap-cap-ai-request-hub_0.1.0.mtar
          sha256sum mta_archives/sap-cap-ai-request-hub_0.1.0.mtar

      - name: Upload MTA archive
        uses: actions/upload-artifact@v7
        with:
          path: mta_archives/sap-cap-ai-request-hub_0.1.0.mtar
          archive: false
          if-no-files-found: error
          retention-days: 7
