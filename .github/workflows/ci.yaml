name: Request Hub CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Install and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

  package:
    name: Build MTA archive
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Cloud MTA Build Tool
        run: npm install --global mbt@1.2.49

      - name: Build MTA archive
        run: mbt build -t mta_archives --mtar sap-cap-ai-request-hub_0.1.0.mtar

      - name: Verify MTA archive
        run: |
          ls -lh mta_archives/sap-cap-ai-request-hub_0.1.0.mtar
          sha256sum mta_archives/sap-cap-ai-request-hub_0.1.0.mtar

      - name: Upload MTA archive
        uses: actions/upload-artifact@v7
        with:
          path: mta_archives/sap-cap-ai-request-hub_0.1.0.mtar
          archive: false
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to BTP Trial
    needs: package
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: btp-trial-dev

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download MTA archive
        uses: actions/download-artifact@v8
        with:
          name: sap-cap-ai-request-hub_0.1.0.mtar

      - name: Verify downloaded MTA archive
        run: |
          ls -lh sap-cap-ai-request-hub_0.1.0.mtar
          sha256sum sap-cap-ai-request-hub_0.1.0.mtar

      - name: Install Cloud Foundry CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/cli.cloudfoundry.org.gpg

          echo "deb [signed-by=/usr/share/keyrings/cli.cloudfoundry.org.gpg] https://packages.cloudfoundry.org/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list

          sudo apt-get update
          sudo apt-get install -y cf8-cli

          cf version

      - name: Install MultiApps plugin
        run: |
            cf add-plugin-repo CF-Community https://plugins.cloudfoundry.org
            cf install-plugin -r CF-Community multiapps -f

            cf plugins

      - name: Get short-lived GitHub OIDC token
        id: get-github-jwt
        env:
          IAS_ISSUER: ${{ vars.IAS_ISSUER }}
        run: |
          githubJwt=$(curl -sS --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json; api-version=2.0" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$IAS_ISSUER" \
            | jq -r '.value')

          test -n "$githubJwt"
          test "$githubJwt" != "null"

          echo "::add-mask::$githubJwt"
          echo "githubJwt=$githubJwt" >> "$GITHUB_OUTPUT"

      - name: Set Cloud Foundry API
        env:
          CF_API: ${{ vars.CF_API }}
        run: |
          cf api "$CF_API"

      - name: Authenticate to Cloud Foundry with GitHub OIDC
        env:
          GITHUB_JWT: ${{ steps.get-github-jwt.outputs.githubJwt }}
          CF_ORIGIN: ${{ vars.CF_ORIGIN }}
        run: |
          cf auth --assertion "$GITHUB_JWT" --origin "$CF_ORIGIN"

      - name: Target Cloud Foundry org and space
        env:
          CF_ORG: ${{ vars.CF_ORG }}
          CF_SPACE: ${{ vars.CF_SPACE }}
        run: |
          cf target -o "$CF_ORG" -s "$CF_SPACE"
          cf target

      - name: Deploy MTA to SAP BTP
        run: |
          cf deploy sap-cap-ai-request-hub_0.1.0.mtar -f

      - name: Smoke test deployed CAP service
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$APP_URL/odata/v4/request/Requests")

          echo "HTTP status: $status"

          test "$status" = "401"

      - name: Logout from Cloud Foundry
        if: always()
        run: |
          cf logout